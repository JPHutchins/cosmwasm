name: packages

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

env:
  TOOLCHAIN_STABLE: 1.82.0 # Rust toolchain for building packages.
  CAMAS: uv run tasks.py # Task runner; tasks.py is the single source of truth (camas pinned there).

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Emit crate matrix from tasks.py
        id: emit
        run: echo "matrix=$(${{ env.CAMAS }} ci --github-matrix)" >> "$GITHUB_OUTPUT"

  format:
    name: format-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_STABLE }}
          components: rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - run: ${{ env.CAMAS }} fmt-check

  packages:
    name: ${{ matrix.crate }}-${{ matrix.os }}
    needs: [ discover ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        crate: ${{ fromJSON(needs.discover.outputs.matrix).crate }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_STABLE }}
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
          components: clippy

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - run: ${{ env.CAMAS }} ${{ matrix.crate }}
